<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFF0DC" />
  <title>Nitecap</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="country-picker" aria-labelledby="page-title">
    <img class="brand-logo" id="page-title" src="nitecap-logo.jpg" alt="Nitecap" />
    <span class="divider" aria-hidden="true"></span>
    <nav class="locations" aria-label="Choose your region">
      <a href="https://app.zappie.ai/order/nitecaptailslimited/yababranch?menu_id=jq7lM2hNMAUbctmpGYJP1&menu_layout=LIST&pickup=false" target="_blank" rel="noreferrer">
        <span class="nigeria-icon" aria-hidden="true">🇳🇬</span><span>Nigeria</span>
      </a>
      <a href="#other-countries">
        <span class="globe-icon" aria-hidden="true"></span><span>Other Countries <small class="soon">coming soon ✦</small></span>
      </a>
      <a href="events.html" class="event-guide-link">
        <span class="event-icon" aria-hidden="true">✦</span><span>Event Guide</span>
      </a>
    </nav>

    <section class="product-showcase" aria-label="Our cocktails">
      <h2 class="product-heading">Pick your kind of trouble</h2>
      <div class="product-strip">
        <img src="strawberry-bliss.jpg" alt="Strawberry Bliss" width="140" height="140" />
        <img src="pineapple-express.jpg" alt="Pineapple Express" width="140" height="140" />
        <img src="long-island.jpg" alt="Long Island" width="140" height="140" />
        <img src="pornstar-martini.jpg" alt="Pornstar Martini" width="140" height="140" />
        <img src="mojito-mood.jpg" alt="Mojito Mood" width="140" height="140" />
      </div>
    </section>

    <p class="notice" id="other-countries" role="status">We’re coming to more countries soon.</p>
  </main>
</body>
</html>
