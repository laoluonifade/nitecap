<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>Order desk — Nitecap</title><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="checkout.css"/><script src="orders.js" defer></script></head>
<body class="checkout-page"><main class="admin-main"><h1>Nitecap order desk</h1><p>Use the admin token stored in your Render environment. Customer details are private.</p><form id="login"><label for="token">Admin token</label><br/><input id="token" type="password" autocomplete="off" required minlength="32"/><button type="submit">Load orders</button></form><p id="admin-status" role="status"></p><button id="refresh" type="button" hidden>Refresh</button> <button id="logout" type="button" hidden>Lock order desk</button><div class="admin-table"><table hidden id="orders"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Fulfilment</th><th>Payment</th></tr></thead><tbody id="order-rows"></tbody></table></div></main></body></html>
